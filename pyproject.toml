[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desgrampa"
version = "0.1.0"
description = "Detector de spyware, stalkerware e vigilância para Android via USB — self-hosted, com painel web local."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Contribuidores do Desgrampa" }]
keywords = ["android", "spyware", "stalkerware", "pegasus", "mvt", "forensics", "adb", "privacy", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
forense = ["mvt>=2.6"]          # análise do bugreport pelo Mobile Verification Toolkit (Anistia Internacional)
dev = ["ruff>=0.6"]

[project.scripts]
desgrampa = "desgrampa.cli:main"

[project.urls]
Homepage = "https://github.com/bernardofernandezz/desgrampa"
Issues = "https://github.com/bernardofernandezz/desgrampa/issues"

[tool.setuptools.packages.find]
include = ["desgrampa*"]

[tool.setuptools.package-data]
desgrampa = ["web/*.html", "web/*.css", "web/js/*.js", "dados/*.json", "dados/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "B904", "SIM102", "SIM108", "UP015"]
