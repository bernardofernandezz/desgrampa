# Indicadores de stalkerware com foco no Brasil (formato compatível com AssoEchap/stalkerware-indicators).
#
# Para que serve:
# - marca as famílias vendidas no Brasil: o relatório lembra que vender ou distribuir programa feito
#   para invadir aparelhos também é crime (Código Penal, art. 154-A, § 1º);
# - recebe indicadores novos achados no Brasil antes de entrarem na base da AssoEchap. Todo indicador
#   novo precisa de fonte verificável (amostra, análise publicada, site do vendedor) e deve ser enviado
#   também para https://github.com/AssoEchap/stalkerware-indicators.
#
# Campos: name, packages, certificates (SHA-1), websites, c2 {domains, ips}, vendido_no_brasil, fonte.
# As entradas abaixo vêm da AssoEchap (CC BY 4.0) — veja docs/indicadores-br.md para contribuir.

